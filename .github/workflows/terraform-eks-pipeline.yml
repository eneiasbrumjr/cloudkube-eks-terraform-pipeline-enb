name: "Terraform EKS Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-eks-pipeline.yml'
      - '.terraform-docs.yml'
      - 'scripts/scan-terraform.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-eks-pipeline.yml'
      - '.terraform-docs.yml'
      - 'scripts/scan-terraform.sh'
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run (plan and apply require AWS and remote state)"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - plan
          - apply

# Prevent concurrent executions of the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-validate:
    name: "Terraform Format, Validate & Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: "Terraform Format Check"
        id: fmt
        run: terraform fmt -check -recursive

      - name: "Terraform Init Without Backend"
        id: init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: "Terraform Validate"
        id: validate
        run: terraform validate -no-color

      - name: "Terraform Tests with Mocked Providers"
        id: test
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: terraform test -no-color

      - name: "Summarize Validation"
        if: always()
        env:
          FMT_RESULT: ${{ steps.fmt.outcome }}
          INIT_RESULT: ${{ steps.init.outcome }}
          VALIDATE_RESULT: ${{ steps.validate.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
        run: |
          {
            echo "## Terraform validation"
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| Format | %s |\n' "$FMT_RESULT"
            printf '| Init without backend | %s |\n' "$INIT_RESULT"
            printf '| Validate | %s |\n' "$VALIDATE_RESULT"
            printf '| Tests with mocked providers | %s |\n' "$TEST_RESULT"
            echo ""
            echo "Test plans use mocked AWS and TLS providers. These checks do not authenticate to AWS, plan against a cloud account, or apply resources."
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-security-scan:
    name: "Security Report (Advisory)"
    needs: terraform-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "Setup Trivy"
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.1
          cache: "false"

      - name: "Run Trivy Configuration Scan"
        run: bash scripts/scan-terraform.sh results.sarif

      - name: "Upload Security Report Artifact"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 7

      - name: "Upload SARIF to GitHub Security"
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          checkout_path: infra

  terraform-docs:
    name: "Generate Terraform Documentation"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "Generate Terraform Docs"
        uses: terraform-docs/gh-actions@v1.1.0
        with:
          working-dir: infra
          output-file: ../README.md
          output-method: inject
          git-push: "false"

      - name: "Upload Generated README"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-documentation
          path: README.md
          if-no-files-found: error
          retention-days: 7

  terraform-plan:
    name: "Terraform Plan (Manual)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [terraform-validate, terraform-security-scan, terraform-docs]
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'plan' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "Configure AWS Credentials via OIDC"
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsPlan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Configure AWS Credentials via Access Keys"
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: "Terraform Init"
        run: terraform init -input=false -lockfile=readonly

      - name: "Require Initialized S3 Backend"
        run: |
          # Backend metadata format for the pinned Terraform 1.12.2.
          if ! jq -e '.version == 3 and .backend.type == "s3"' \
            .terraform/terraform.tfstate >/dev/null 2>&1; then
            echo "::error::Cloud operations require an initialized S3 backend. Configure durable remote state first."
            exit 1
          fi

      - name: "Terraform Plan"
        run: terraform plan -input=false -no-color

  terraform-apply:
    name: "Terraform Apply (Manual)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [terraform-validate, terraform-security-scan, terraform-docs]
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://console.aws.amazon.com/eks/
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: "Checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "Configure AWS Credentials via OIDC"
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsApply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Configure AWS Credentials via Access Keys"
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: "Terraform Init"
        run: terraform init -input=false -lockfile=readonly

      - name: "Require Initialized S3 Backend"
        run: |
          # Backend metadata format for the pinned Terraform 1.12.2.
          if ! jq -e '.version == 3 and .backend.type == "s3"' \
            .terraform/terraform.tfstate >/dev/null 2>&1; then
            echo "::error::Cloud operations require an initialized S3 backend. Configure durable remote state first."
            exit 1
          fi

      - name: "Terraform Plan"
        run: terraform plan -input=false -no-color -out=tfplan

      - name: "Terraform Apply"
        run: terraform apply -input=false -auto-approve -no-color tfplan
